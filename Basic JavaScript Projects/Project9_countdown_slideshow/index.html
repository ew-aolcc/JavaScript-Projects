<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/main.css">
    <title>JavaScript Program</title>
    <!--use defer to load the script after the page has loaded-->
    <script src="JS/main.js" defer>
    </script>
</head>
<body>
<main>
   <!-- countdown section-->
    <div>
        <p>How many seconds would you like to set your alarm for?</p>
        <input id="Seconds" type="text" value="60">
        <button onclick="countDown()">Set Alarm</button>
        <p id="Timer"></p>
    </div>

    <!--slide show sec-->tion
    <div>
        <!-- Slideshow Container -->
        <div class="slideshow-container">

            <!-- Full-width images with number and caption text -->
            <div class="mySlides fade">
                <div class="numbertext">1 / 3</div>
                <img src="https://picsum.photos/id/1018/1000/600" alt="Slide 1">
                <div class="text">Caption One</div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">2 / 3</div>
                <img src="https://picsum.photos/id/1015/1000/600" alt="Slide 2">
                <div class="text">Caption Two</div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">3 / 3</div>
                <img src="https://picsum.photos/id/1019/1000/600" alt="Slide 3">
                <div class="text">Caption Three</div>
            </div>

            <!-- Next and previous buttons -->
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>

        </div>
        <br>

        <!-- Navigation Dots -->
        <div style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
        </div>
    </div>
</main>
</body>
</html>
