<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Operators Assignment</title>
</head>
<body>
<h1>JavaScript Math Operators</h1>

<!-- Addition -->
<p id="Addition" onclick="additionFunction()">Click here to calculate 9 + 9</p>

<!-- Subtraction -->
<p id="Subtraction" onclick="subtractionFunction()">Click here to calculate 10 - 1</p>

<!-- Multiplication -->
<p id="Multiplication" onclick="multiplicationFunction()">Click here to calculate 10 * 10</p>

<!-- Modulus (Remainder) -->
<p id="Modulus" onclick="modulusFunction()">Click here to find the remainder of 9 mod 3</p>

<!-- Increment -->
<p id="Increment" onclick="incrementFunction()">Click here to increment 11</p>

<!-- Decrement -->
<p id="Decrement" onclick="decrementFunction()">Click here to decrement 10</p>

<!-- Random Number -->
<p id="Random" onclick="randomFunction()">Click here to generate a random number</p>
</body>
